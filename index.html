<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#f5f0e8">
<title>Мясорубка</title>
<link rel="stylesheet" href="css/style.css">

</head>
<body>
<canvas id="game"></canvas>
<div class="touch-ui" id="touch-ui">
<div class="stick-base" id="stick-base"><div class="stick-knob" id="stick-knob"></div></div>
<div class="btn btn-dash" id="btn-dash">D</div>
<div class="btn btn-reload" id="btn-reload">R</div>
</div>

<div id="hud-inventory" style="position:fixed; top:40px; left:12px; display:flex; gap:6px; pointer-events:none; z-index:5;">
</div>

<div class="desktop-hints">WASD — движение · Мышь — прицел · ЛКМ — стрельба · R — перезарядка · SHIFT — рывок</div>
<div class="name-entry" id="name-entry">
<form id="name-form">
<div class="name-entry-title">НОВЫЙ РЕКОРД!</div>
<input id="name-input" maxlength="12" autocomplete="off" placeholder="ТВОЁ ИМЯ" inputmode="text" enterkeyhint="done"/>
<button type="submit">OK</button>
</form>
</div>

<div class="name-entry" id="upgrades-menu" style="display:none; flex-direction:column;">
  <div style="background:#fff; border:2px solid var(--ind); padding:24px; border-radius:12px; max-width:90vw; width:500px; display:flex; flex-direction:column; gap:16px;">
    <div class="name-entry-title">ПРОКАЧКА</div>
    <div style="text-align:center; font-size:18px; color:var(--ind); font-weight:bold;">ОСКОЛКИ: <span id="upgrade-shards-count">0</span></div>

    <div style="display:flex; flex-direction:column; gap:8px;" id="upgrades-list">
      <!-- Upgrades will be populated here -->
    </div>

    <button id="btn-upgrades-close" style="background:var(--bone); color:#fff; border:none; padding:12px; font-weight:bold; border-radius:6px; cursor:pointer; font-family:'Courier New',monospace; font-size:16px; margin-top: 8px;">ЗАКРЫТЬ</button>
  </div>
</div>

<div class="name-entry" id="loot-compare" style="display:none; flex-direction:column;">
  <div style="background:#fff; border:2px solid var(--ind); padding:20px; border-radius:12px; max-width:90vw; width:450px; display:flex; flex-direction:column; gap:16px;">
    <div class="name-entry-title">ИНВЕНТАРЬ ПОЛОН</div>
    <div style="font-size:14px; text-align:center; color:#555;">Выберите предмет для замены</div>
    <div id="loot-compare-slots" style="display:flex; justify-content:space-between; gap:8px;"></div>

    <div style="display:flex; gap:16px; margin-top:10px;">
      <div id="loot-compare-current" style="flex:1; border:1px solid #ccc; border-radius:6px; padding:12px; text-align:center;">
        <div style="font-size:12px; color:#777; margin-bottom:8px;">ТЕКУЩИЙ</div>
        <div id="lc-curr-icon" style="font-size:24px; margin-bottom:4px;"></div>
        <div id="lc-curr-stats" style="font-size:12px; text-align:left;"></div>
      </div>

      <div id="loot-compare-new" style="flex:1; border:2px solid var(--ind); border-radius:6px; padding:12px; text-align:center; background:#faf8f4;">
        <div style="font-size:12px; color:var(--ind); margin-bottom:8px; font-weight:bold;">НОВЫЙ</div>
        <div id="lc-new-icon" style="font-size:24px; margin-bottom:4px;"></div>
        <div id="lc-new-stats" style="font-size:12px; text-align:left;"></div>
      </div>
    </div>

    <div style="display:flex; gap:12px; margin-top:10px;">
      <button id="btn-loot-skip" style="flex:1; background:#999; color:#fff; border:none; padding:12px; font-weight:bold; border-radius:6px; cursor:pointer;">ПРОПУСТИТЬ</button>
      <button id="btn-loot-replace" style="flex:1; background:var(--ind); color:#1a1a1a; border:none; padding:12px; font-weight:bold; border-radius:6px; cursor:pointer;" disabled>ЗАМЕНИТЬ</button>
    </div>
  </div>
</div>

<script src="js/input.js"></script>
<script src="js/floors.js"></script>
<script src="js/weapons.js"></script>
<script src="js/enemies.js"></script>
<script src="js/loot.js"></script>
<script src="js/ui.js"></script>
<script src="js/game.js"></script>

<div class="name-entry" id="portal-ui" style="display:none; flex-direction:column; background:rgba(26,26,26,0.7);">
  <div style="background:#fff; border:2px solid var(--cyan); padding:24px; border-radius:12px; max-width:90vw; width:400px; display:flex; flex-direction:column; gap:16px;">
    <div class="name-entry-title" style="color:var(--cyan);">ПОРТАЛ</div>
    <div style="text-align:center; font-size:14px; color:#555;">Твоя мясорубка может закончиться здесь.</div>
    <div style="display:flex; flex-direction:column; gap:12px; margin-top:10px;">
      <button id="btn-portal-descend" style="background:var(--cyan); color:#1a1a1a; border:none; padding:14px; font-weight:bold; border-radius:6px; cursor:pointer; font-size:16px;">СПУСТИТЬСЯ (СЛЕД. ЭТАЖ)</button>
      <button id="btn-portal-evac" style="background:var(--ind); color:#1a1a1a; border:none; padding:14px; font-weight:bold; border-radius:6px; cursor:pointer; font-size:16px;">ЭВАКУАЦИЯ (+30% ОСКОЛКОВ)</button>
      <button id="btn-portal-cancel" style="background:#999; color:#fff; border:none; padding:12px; font-weight:bold; border-radius:6px; cursor:pointer; font-size:14px; margin-top:8px;">ОТМЕНА</button>
    </div>
  </div>
</div>

</body>
</html>

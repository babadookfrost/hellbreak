<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#f5f0e8">
<title>Мясорубка</title>
<style>
:root{--bg:#f5f0e8;--bone:#1a1a1a;--blood:#d92638;--ind:#e8a317;--cyan:#0ea5c7;}
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;touch-action:none;font-family:'Courier New',monospace;}
html,body{background:var(--bg);color:var(--bone);overflow:hidden;height:100%;width:100%;}
body{height:100dvh;width:100dvw;position:fixed;inset:0;}
canvas{display:block;background:var(--bg);cursor:crosshair;position:fixed;inset:0;width:100%;height:100%;}

.touch-ui{position:fixed;inset:0;pointer-events:none;z-index:10;display:none;}
@media(pointer:coarse){.touch-ui{display:block;}}

.stick-base{position:absolute;left:max(14px,3vw);bottom:max(14px,3vh);width:clamp(90px,16vw,140px);height:clamp(90px,16vw,140px);background:rgba(200,190,170,0.45);border-radius:50%;pointer-events:none;border:2px solid rgba(200,160,80,0.4);touch-action:none;}
.stick-knob{position:absolute;left:50%;top:50%;width:clamp(32px,9vw,52px);height:clamp(32px,9vw,52px);margin:calc(clamp(32px,9vw,52px)/-2) 0 0 calc(clamp(32px,9vw,52px)/-2);background:var(--ind);border-radius:50%;box-shadow:0 0 12px rgba(200,160,50,0.5);pointer-events:none;}

.btn{position:absolute;width:clamp(52px,13vw,76px);height:clamp(52px,13vw,76px);background:rgba(220,210,190,0.6);border:2px solid var(--bone);color:var(--bone);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:clamp(16px,4.5vw,24px);font-weight:bold;pointer-events:auto;touch-action:none;}
.btn:active{background:rgba(217,38,56,0.35);border-color:var(--blood);transform:scale(0.9);}
.btn-reload{right:max(14px,3vw);bottom:max(14px,3vh);}
.btn-dash{right:calc(max(14px,3vw) + clamp(58px,14vw,88px));bottom:max(14px,3vh);background:rgba(14,165,199,0.15);border-color:var(--cyan);}
.btn-dash:active{background:rgba(14,165,199,0.35);}

.name-entry{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(245,240,232,0.92);z-index:20;}
.name-entry form{display:flex;flex-direction:column;gap:16px;align-items:center;background:#fff;border:2px solid var(--ind);padding:36px 44px;border-radius:12px;max-width:90vw;box-shadow:0 4px 30px rgba(0,0,0,0.15);}
.name-entry-title{color:var(--ind);font-weight:bold;font-size:clamp(20px,5.5vw,26px);letter-spacing:3px;text-align:center;}
.name-entry input{font-family:'Courier New',monospace;font-size:clamp(16px,4.5vw,20px);padding:12px 16px;background:#faf8f4;border:1px solid rgba(26,26,26,0.3);color:var(--bone);border-radius:6px;text-transform:uppercase;width:min(240px,72vw);text-align:center;outline:none;}
.name-entry input:focus{border-color:var(--ind);box-shadow:0 0 12px rgba(232,163,23,0.3);}
.name-entry button{font-family:'Courier New',monospace;font-size:17px;font-weight:bold;padding:12px 32px;background:var(--ind);color:#1a1a1a;border:none;border-radius:6px;cursor:pointer;width:100%;}
.name-entry button:active{transform:scale(0.96);}

.desktop-hints{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);color:rgba(26,26,26,0.35);font-size:11px;pointer-events:none;z-index:5;text-align:center;white-space:nowrap;}
@media(pointer:coarse){.desktop-hints{display:none;}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="touch-ui" id="touch-ui">
<div class="stick-base" id="stick-base"><div class="stick-knob" id="stick-knob"></div></div>
<div class="btn btn-dash" id="btn-dash">D</div>
<div class="btn btn-reload" id="btn-reload">R</div>
</div>
<div class="desktop-hints">WASD — движение · Мышь — прицел · ЛКМ — стрельба · R — перезарядка · SHIFT — рывок</div>
<div class="name-entry" id="name-entry">
<form id="name-form">
<div class="name-entry-title">НОВЫЙ РЕКОРД!</div>
<input id="name-input" maxlength="12" autocomplete="off" placeholder="ТВОЁ ИМЯ" inputmode="text" enterkeyhint="done"/>
<button type="submit">OK</button>
</form>
</div>
<script>
"use strict";
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  if (typeof Game !== 'undefined') {
    Game.viewW = canvas.width;
    Game.viewH = canvas.height;
    Game.effViewW = canvas.width;
    Game.effViewH = canvas.height;
  }
}

const TILE=80,MAP_W=48,MAP_H=48,BLOCK=6,MAP_PX_W=MAP_W*TILE,MAP_PX_H=MAP_H*TILE;
const WEAPON_POOL=['pistol','shotgun','smg','lmg','bow','rocket'];
const WEAPONS={
  pistol:{id:'pistol',name:'Пистолет',icon:'◆',cd:0.28,pellets:3,spread:0.07,jitter:0.02,speed:1200,dmg:1,ammoMax:6,reload:1.3,pierce:1,auto:false},
  shotgun:{id:'shotgun',name:'Дробовик',icon:'▲',cd:0.8,pellets:8,spread:0.24,jitter:0.05,speed:900,dmg:1,ammoMax:2,reload:1.7,pierce:1,auto:false},
  smg:{id:'smg',name:'Автомат',icon:'■',cd:0.09,pellets:1,spread:0,jitter:0.08,speed:1300,dmg:1,ammoMax:30,reload:1.5,pierce:1,auto:true},
  lmg:{id:'lmg',name:'Пулемёт',icon:'●',cd:0.055,pellets:1,spread:0,jitter:0.11,speed:1300,dmg:1,ammoMax:80,reload:2.2,pierce:1,auto:true},
  bow:{id:'bow',name:'Лук',icon:'➤',cd:0.5,pellets:1,spread:0,jitter:0,speed:1000,dmg:4,ammoMax:5,reload:1.0,pierce:99,auto:false},
  rocket:{id:'rocket',name:'Гранатомёт',icon:'✹',cd:0.85,pellets:1,spread:0,jitter:0,speed:800,dmg:5,ammoMax:4,reload:2.0,pierce:1,auto:false,splash:140}
};
const ENEMY_BASE={melee:{hp:1,speed:160,r:16},shooter:{hp:2,speed:50,r:16,fireCd:1.5,bulletSpeed:500},tank:{hp:6,speed:95,r:22}};

function getLevelConfig(li){
  const shift=li%WEAPON_POOL.length;
  const rotated=WEAPON_POOL.slice(shift).concat(WEAPON_POOL.slice(0,shift));
  return{index:li,name:'УРОВЕНЬ '+(li+1),weaponOrder:rotated.slice(0,5),weaponWaves:[1,3,5,7,9],bossWave:10,enemyTypes:li>=1?['melee','shooter','tank']:['melee','shooter'],hpMul:1+li*0.8,speedMul:1+li*0.18,dmgMul:1+li*0.3,bossHp:60+li*50};
}

function compact(arr,dk){let w=0;for(let i=0;i<arr.length;i++)if(!arr[i][dk])arr[w++]=arr[i];arr.length=w;}
function compactByLife(arr){let w=0;for(let i=0;i<arr.length;i++)if(arr[i].life>0)arr[w++]=arr[i];arr.length=w;}
const CELL=96;
function buildGrid(ents){const g=new Map();for(let i=0;i<ents.length;i++){const e=ents[i];const k=(Math.floor(e.x/CELL))+','+(Math.floor(e.y/CELL));let b=g.get(k);if(!b){b=[];g.set(k,b);}b.push(e);}return g;}
function forNearby(g,x,y,cb){const cx=Math.floor(x/CELL),cy=Math.floor(y/CELL);for(let ox=-1;ox<=1;ox++)for(let oy=-1;oy<=1;oy++){const b=g.get((cx+ox)+','+(cy+oy));if(b)for(let i=0;i<b.length;i++)cb(b[i]);}}
const clamp=(v,a,b)=>Math.max(a,Math.min(v,b));
function easeOutBack(x){const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);}

function generateMap(){
  const grid=new Uint8Array(MAP_W*MAP_H);
  const idx=(x,y)=>y*MAP_W+x;
  for(let y=0;y<MAP_H;y++)for(let x=0;x<MAP_W;x++){const edge=x===0||y===0||x===MAP_W-1||y===MAP_H-1;grid[idx(x,y)]=edge?1:0;}
  const bx=Math.ceil(MAP_W/BLOCK),by=Math.ceil(MAP_H/BLOCK);
  for(let byi=0;byi<by;byi++)for(let bxi=0;bxi<bx;bxi++){
    if(Math.random()>0.55)continue;
    const pat=Math.random();
    const y0=byi*BLOCK+2,y1=Math.min(byi*BLOCK+BLOCK,MAP_H-1);
    const x0=bxi*BLOCK+2,x1=Math.min(bxi*BLOCK+BLOCK,MAP_W-1);
    for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++){let wall=pat<0.4?Math.random()<0.7:(pat<0.7?(x+y)%2===0:Math.random()<0.35);if(wall)grid[idx(x,y)]=1;}
  }
  const cx=Math.floor(MAP_W/2),cy=Math.floor(MAP_H/2);
  for(let y=cy-3;y<=cy+3;y++)for(let x=cx-3;x<=cx+3;x++)if(x>0&&y>0&&x<MAP_W-1&&y<MAP_H-1)grid[idx(x,y)]=0;
  return{grid,idx,pxW:MAP_PX_W,pxH:MAP_PX_H,spawnWorld:{x:(cx+0.5)*TILE,y:(cy+0.5)*TILE}};
}
function isWallTile(map,tx,ty){if(tx<0||ty<0||tx>=MAP_W||ty>=MAP_H)return true;return map.grid[map.idx(tx,ty)]===1;}
function isWallWorld(map,x,y){return isWallTile(map,Math.floor(x/TILE),Math.floor(y/TILE));}
function circleBlocked(map,x,y,r){return isWallWorld(map,x-r,y)||isWallWorld(map,x+r,y)||isWallWorld(map,x,y-r)||isWallWorld(map,x,y+r);}
function moveWithCollision(map,e,dx,dy){
  if(dx!==0){const nx=clamp(e.x+dx,TILE*0.6,MAP_PX_W-TILE*0.6);if(!circleBlocked(map,nx,e.y,e.r))e.x=nx;}
  if(dy!==0){const ny=clamp(e.y+dy,TILE*0.6,MAP_PX_H-TILE*0.6);if(!circleBlocked(map,e.x,ny,e.r))e.y=ny;}
}
function raycastClear(map,x0,y0,x1,y1){const steps=Math.ceil(Math.hypot(x1-x0,y1-y0)/(TILE*0.5));for(let i=1;i<steps;i++){const t=i/steps;if(isWallWorld(map,x0+(x1-x0)*t,y0+(y1-y0)*t))return false;}return true;}
function randomFloorTileFar(map,fx,fy,md){for(let a=0;a<60;a++){const tx=1+Math.floor(Math.random()*(MAP_W-2)),ty=1+Math.floor(Math.random()*(MAP_H-2));if(isWallTile(map,tx,ty))continue;const wx=(tx+0.5)*TILE,wy=(ty+0.5)*TILE;if(Math.hypot(wx-fx,wy-fy)>=md)return{x:wx,y:wy};}return{x:clamp(fx+md,TILE,MAP_PX_W-TILE),y:fy};}

class Camera{constructor(){this.x=0;this.y=0;}follow(t,vw,vh,dt){const tx=clamp(t.x-vw/2,0,Math.max(0,MAP_PX_W-vw));const ty=clamp(t.y-vh/2,0,Math.max(0,MAP_PX_H-vh));const e=Math.min(1,dt*8);this.x+=(tx-this.x)*e;this.y+=(ty-this.y)*e;}}

function burst(Game,x,y,count,color,speed,gravity){for(let i=0;i<count;i++){const a=Math.random()*Math.PI*2;const sp=(0.3+Math.random()*0.7)*speed;Game.particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:0.5+Math.random()*0.4,color,size:2+Math.random()*5,gravity:gravity||0});}}
function muzzleFlash(Game,x,y,ang){Game.particles.push({x:x+Math.cos(ang)*20,y:y+Math.sin(ang)*20,vx:Math.cos(ang)*60,vy:Math.sin(ang)*60,life:0.15,color:'#fff',size:14,glow:true});Game.particles.push({x:x+Math.cos(ang)*16,y:y+Math.sin(ang)*16,vx:Math.cos(ang)*30,vy:Math.sin(ang)*30,life:0.1,color:'#e8a317',size:8,glow:true});}
function screenFlash(Game,intensity){Game.flash=Math.max(Game.flash||0,intensity);}
function screenShake(Game,amount){Game.shake=Math.max(Game.shake||0,amount);}
function spawnBanner(Game,opts){Game.banners.push({title:opts.title,subtitle:opts.subtitle,color:opts.color||'#e8a317',t:0,duration:2.0});}
function spawnFloatingText(Game,x,y,text,color){Game.floatTexts.push({x,y,text,color,life:1.0,vy:-60+Math.random()*-40,vx:(Math.random()-0.5)*30,t:0});}
function spawnImpact(Game,x,y,color,size){Game.impacts.push({x,y,r:size||20,color:color||'#fff',life:0.12,t:0});burst(Game,x,y,8,color||'#fff',150,200);}

function updateAndDrawBanners(ctx,Game,dt,W,H){
  if(!Game.banners.length)return;
  const b=Game.banners[0];b.t+=dt;const p=b.t/b.duration;if(p>=1){Game.banners.shift();return;}
  let scale=1,alpha=1;if(p<0.2)scale=4-3*easeOutBack(p/0.2);else if(p>0.75)alpha=1-(p-0.75)/0.25;
  ctx.save();ctx.globalAlpha=alpha;ctx.translate(W/2,H*0.28);ctx.scale(scale,scale);
  ctx.strokeStyle='rgba(0,0,0,'+(0.15*alpha)+')';ctx.lineWidth=2;
  for(let s=0;s<12;s++){const a=(s/12)*Math.PI*2+b.t*3;ctx.beginPath();ctx.moveTo(Math.cos(a)*90,Math.sin(a)*90);ctx.lineTo(Math.cos(a)*180,Math.sin(a)*180);ctx.stroke();}
  ctx.shadowColor=b.color;ctx.shadowBlur=20;ctx.textAlign='center';ctx.font='bold 56px monospace';ctx.lineWidth=8;ctx.strokeStyle='rgba(255,255,255,0.8)';ctx.strokeText(b.title,0,0);ctx.fillStyle=b.color;ctx.fillText(b.title,0,0);
  ctx.font='bold 30px monospace';ctx.strokeText(b.subtitle,0,48);ctx.fillStyle='#1a1a1a';ctx.fillText(b.subtitle,0,48);ctx.shadowBlur=0;ctx.restore();
}

function updateAndDrawFloatTexts(ctx,Game,dt){
  for(let i=0;i<Game.floatTexts.length;i++){
    const ft=Game.floatTexts[i];ft.t+=dt;ft.life-=dt;ft.x+=ft.vx*dt;ft.y+=ft.vy*dt;ft.vy+=80*dt;
    const a=Math.max(0,ft.life);ctx.globalAlpha=a;ctx.font='bold 22px monospace';ctx.textAlign='center';
    ctx.strokeStyle='rgba(255,255,255,'+a+')';ctx.lineWidth=4;ctx.strokeText(ft.text,ft.x,ft.y);ctx.fillStyle=ft.color;ctx.fillText(ft.text,ft.x,ft.y);
  }
  ctx.globalAlpha=1;let w=0;for(let i=0;i<Game.floatTexts.length;i++)if(Game.floatTexts[i].life>0)Game.floatTexts[w++]=Game.floatTexts[i];Game.floatTexts.length=w;
}

function updateAndDrawImpacts(ctx,Game,dt){
  for(let i=0;i<Game.impacts.length;i++){
    const im=Game.impacts[i];im.t+=dt;im.life-=dt;const p=im.t/(im.life+im.t);const r=im.r*(1+p*2);const a=Math.max(0,1-p);
    ctx.globalAlpha=a;ctx.strokeStyle=im.color;ctx.lineWidth=3;ctx.beginPath();ctx.arc(im.x,im.y,r,0,Math.PI*2);ctx.stroke();
    ctx.fillStyle=im.color;ctx.beginPath();ctx.arc(im.x,im.y,r*0.3,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;let w=0;for(let i=0;i<Game.impacts.length;i++)if(Game.impacts[i].life>0)Game.impacts[w++]=Game.impacts[i];Game.impacts.length=w;
}

const LB_KEY='myasorubka_leaderboard_v4';
function loadLeaderboard(){try{const r=JSON.parse(localStorage.getItem(LB_KEY));return Array.isArray(r)?r:[];}catch{return[];}}
function saveLeaderboard(l){try{localStorage.setItem(LB_KEY,JSON.stringify(l.slice(0,10)));}catch{}}
function qualifies(l,s){return l.length<10||s>l[l.length-1].score;}
function addEntry(l,e){const n=[...l,e].sort((a,b)=>b.score-a.score).slice(0,10);saveLeaderboard(n);return n;}

const isMobile='ontouchstart' in window||navigator.maxTouchPoints>0;
const Input={keys:{},mouse:{x:0,y:0},stick:{active:false,dx:0,dy:0},fireReq:false,wantReload:false,wantDash:false,cmd:false,dashDirX:0,dashDirY:0};
let stickTouchId=null,aimTouchId=null;

function initInput(canvas){
  window.addEventListener('keydown',e=>{
    if(e.repeat)return;
    Input.keys[e.code]=true;
    if(e.code==='ShiftLeft'||e.code==='ShiftRight')Input.wantDash=true;
    if(e.code==='KeyR')Input.wantReload=true;
    if(e.code==='Enter'||e.code==='Space')Input.cmd=true;
  });
  window.addEventListener('keyup',e=>{Input.keys[e.code]=false;});

  const toScreen=(cx,cy)=>{return{x:cx,y:cy};};
  canvas.addEventListener('mousemove',e=>{const p=toScreen(e.clientX,e.clientY);Input.mouse.x=p.x;Input.mouse.y=p.y;});
  canvas.addEventListener('mousedown',e=>{const p=toScreen(e.clientX,e.clientY);Input.mouse.x=p.x;Input.mouse.y=p.y;Input.fireReq=true;Input.cmd=true;});
  canvas.addEventListener('mouseup',()=>{Input.fireReq=false;});
  window.addEventListener('contextmenu',e=>e.preventDefault());

  if(isMobile){
    document.getElementById('touch-ui').style.display='block';
    const stk=document.getElementById('stick-base'),knb=document.getElementById('stick-knob');
    const getStickCenter=()=>{const r=stk.getBoundingClientRect();return {x:r.left+r.width/2, y:r.top+r.height/2, r:r.width/2};};
    const isStickZone=(t)=>{const c=getStickCenter();const pad=35;return (t.clientX <= c.x + c.r + pad && t.clientY >= c.y - c.r - pad);};
    const updateStick=(t)=>{const c=getStickCenter();let dx=t.clientX-c.x, dy=t.clientY-c.y;const maxR=c.r*0.8;const mag=Math.hypot(dx,dy);if(mag>maxR){dx*=maxR/mag;dy*=maxR/mag;}knb.style.transform='translate('+dx+'px,'+dy+'px)';Input.stick.dx=dx/maxR;Input.stick.dy=dy/maxR;Input.stick.active=true;};
    const resetStick=()=>{stickTouchId=null;Input.stick.active=false;Input.stick.dx=0;Input.stick.dy=0;knb.style.transform='translate(0px, 0px)';};

    canvas.addEventListener('touchstart',e=>{
      for(let i=0;i<e.changedTouches.length;i++){
        const t=e.changedTouches[i];
        if(stickTouchId===null && isStickZone(t)){stickTouchId=t.identifier;updateStick(t);}
        else if(aimTouchId===null && t.identifier!==stickTouchId){aimTouchId=t.identifier;Input.mouse.x=t.clientX;Input.mouse.y=t.clientY;Input.fireReq=true;Input.cmd=true;}
      }
    },{passive:true});

    canvas.addEventListener('touchmove',e=>{
      for(let i=0;i<e.changedTouches.length;i++){
        const t=e.changedTouches[i];
        if(t.identifier===stickTouchId){updateStick(t);}
        else if(t.identifier===aimTouchId){Input.mouse.x=t.clientX;Input.mouse.y=t.clientY;}
      }
    },{passive:true});

    canvas.addEventListener('touchend',e=>{
      for(let i=0;i<e.changedTouches.length;i++){
        const t=e.changedTouches[i];
        if(t.identifier===stickTouchId){resetStick();}
        if(t.identifier===aimTouchId){aimTouchId=null;Input.fireReq=false;}
      }
    },{passive:true});

    canvas.addEventListener('touchcancel',e=>{
      for(let i=0;i<e.changedTouches.length;i++){
        const t=e.changedTouches[i];
        if(t.identifier===stickTouchId){resetStick();}
        if(t.identifier===aimTouchId){aimTouchId=null;Input.fireReq=false;}
      }
    },{passive:true});

    document.getElementById('btn-reload').addEventListener('touchstart',e=>{Input.wantReload=true;},{passive:true});
    document.getElementById('btn-dash').addEventListener('touchstart',e=>{Input.dashDirX=Input.stick.dx||1;Input.dashDirY=Input.stick.dy||0;Input.wantDash=true;},{passive:true});
  }
}

function getMoveVector(){
  let mx=0,my=0;
  if(Input.keys['KeyW']||Input.keys['ArrowUp'])my-=1;
  if(Input.keys['KeyS']||Input.keys['ArrowDown'])my+=1;
  if(Input.keys['KeyA']||Input.keys['ArrowLeft'])mx-=1;
  if(Input.keys['KeyD']||Input.keys['ArrowRight'])mx+=1;
  if(!mx&&!my&&Input.stick.active){mx=Input.stick.dx;my=Input.stick.dy;}
  return{mvX:mx,mvY:my};
}

function createPlayer(spawn){
  return{
    x:spawn.x,y:spawn.y,r:14,speed:280,
    weaponId:'pistol',ammo:WEAPONS.pistol.ammoMax,reloading:0,cd:0,
    dashCd:0,dashT:0,dashDX:0,dashDY:0,dashUnlocked:false,invuln:0,
    hp:3,maxHp:3 // 3 HP по умолчанию
  };
}

function applyLevelStart(Game){
  const cfg=getLevelConfig(Game.level);
  Game.levelCfg=cfg;Game.wave=1;Game.spawnT=0.5;Game.globalPower=1;Game.scaleT=5;Game.boss=null;
  Game.player.weaponId=cfg.weaponOrder[0];const w=WEAPONS[Game.player.weaponId];Game.player.ammo=w.ammoMax;Game.player.reloading=0;
}

function maybeUnlockWeapon(Game){
  const cfg=Game.levelCfg,idx=cfg.weaponWaves.indexOf(Game.wave);if(idx===-1)return;
  const wid=cfg.weaponOrder[idx];if(Game.player.weaponId===wid)return;
  Game.player.weaponId=wid;const w=WEAPONS[wid];Game.player.ammo=w.ammoMax;Game.player.reloading=0;
  spawnBanner(Game,{title:'НОВОЕ ОРУЖИЕ',subtitle:w.icon+'  '+w.name.toUpperCase(),color:'#e8a317'});
  screenFlash(Game,0.6);burst(Game,Game.player.x,Game.player.y,30,'#e8a317',300);
}

function maybeUnlockDash(Game){if(Game.player.dashUnlocked||Game.wave<5)return;Game.player.dashUnlocked=true;spawnBanner(Game,{title:'НОВЫЙ НАВЫК',subtitle:'РЫВОК: SHIFT / КНОПКА',color:'#0ea5c7'});screenFlash(Game,0.5);burst(Game,Game.player.x,Game.player.y,35,'#0ea5c7',350);}

function fireWeapon(Game,ax,ay){
  const p=Game.player,w=WEAPONS[p.weaponId];if(p.cd>0||p.ammo<=0||p.reloading>0)return;
  p.cd=w.cd;p.ammo--;Game.shotSlowmo=0.5;if(p.ammo===0)p.reloading=w.reload;
  const ang=Math.atan2(ay-p.y,ax-p.x);const mid=(w.pellets-1)/2;
  for(let i=0;i<w.pellets;i++){
    const a=ang+(i-mid)*w.spread+(Math.random()-0.5)*w.jitter;
    Game.bullets.push({x:p.x,y:p.y,vx:Math.cos(a)*w.speed,vy:Math.sin(a)*w.speed,r:w.splash?7:4,friendly:true,dmg:w.dmg,pierce:w.pierce,splash:w.splash||0,dead:false,trail:[],color:w.id==='rocket'?'#d97706':w.id==='bow'?'#0ea5c7':'#e8a317'});
  }
  muzzleFlash(Game,p.x,p.y,ang);screenShake(Game,w.id==='rocket'?6:w.id==='shotgun'?4:2);
}

function reloadWeapon(Game){const p=Game.player,w=WEAPONS[p.weaponId];if(p.ammo<w.ammoMax&&p.reloading<=0)p.reloading=w.reload;}
function tryDash(Game,dx,dy){const p=Game.player;if(!p.dashUnlocked||p.dashCd>0)return;if(!dx&&!dy)return;const mag=Math.hypot(dx,dy);p.dashDX=dx/mag;p.dashDY=dy/mag;p.dashT=0.16;p.dashCd=2.6;p.invuln=0.24;burst(Game,p.x,p.y,16,'#0ea5c7',250);screenShake(Game,3);}
function updatePlayerMove(Game,dt,mx,my){const p=Game.player;p.dashCd=Math.max(0,p.dashCd-dt);p.invuln=Math.max(0,p.invuln-dt);let moving=false;if(p.dashT>0){p.dashT-=dt;moveWithCollision(Game.map,p,p.dashDX*900*dt,p.dashDY*900*dt);moving=true;}else if(mx||my){const mag=Math.hypot(mx,my);moveWithCollision(Game.map,p,(mx/mag)*p.speed*dt,(my/mag)*p.speed*dt);moving=true;}return moving;}

function spawnEnemy(Game){
  const cfg=Game.levelCfg,type=cfg.enemyTypes[Math.floor(Math.random()*cfg.enemyTypes.length)];
  const base=ENEMY_BASE[type];const vs=Math.max(Game.effViewW||Game.viewW,Game.effViewH||Game.viewH);
  const spot=randomFloorTileFar(Game.map,Game.player.x,Game.player.y,vs*0.7);const power=Math.min(4.5,Game.globalPower);
  const hp=Math.max(1,Math.round(base.hp*cfg.hpMul*power));
  Game.enemies.push({x:spot.x,y:spot.y,r:base.r,type,hp,maxHp:hp,speed:base.speed*cfg.speedMul*Math.min(2.1,power),fireCd:base.fireCd||0,jitter:(Math.random()-0.5)*0.5,dead:false,flash:0});
}

function spawnBoss(Game){
  const cfg=Game.levelCfg;const spot=randomFloorTileFar(Game.map,Game.player.x,Game.player.y,500);
  Game.boss={x:spot.x,y:spot.y,r:46,hp:cfg.bossHp,maxHp:cfg.bossHp,speed:75*cfg.speedMul,burstCd:1.6,dead:false,flash:0,isBoss:true};
  spawnBanner(Game,{title:'БОСС ПРИБЫЛ',subtitle:'ВЫЖИВИ',color:'#d92638'});screenFlash(Game,0.8);screenShake(Game,10);
}

function killEnemy(Game,e){
  if(e.dead)return;
  e.dead=true;
  
  if(!Game.loot) Game.loot = [];
  
  // 25% шанс выпадания HP сферы
  if(Math.random() < 0.25){
    Game.loot.push({x: e.x, y: e.y, type: 'hp', r: 8});
  } 
  // 30% шанс выпадания очков мощи
  else if(Math.random() < 0.3){
    const rand = Math.random();
    const color = rand < 0.05 ? '#ff6600' : (rand < 0.2 ? '#e8a317' : (rand < 0.5 ? '#0ea5c7' : '#ffffff'));
    Game.loot.push({x: e.x, y: e.y, type: 'weapon', color: color, r: 10});
  }

  if(e.isBoss){
    Game.kills+=20;
    burst(Game,e.x,e.y,80,'#d92638',450,150);
    screenFlash(Game,1.0);screenShake(Game,15);
    spawnFloatingText(Game,e.x,e.y-40,'BOSS SLAIN','#e8a317');
    Game.onBossDefeated();
    return;
  }
  
  Game.kills++;
  burst(Game,e.x,e.y,14,e.type==='shooter'?'#b829dd':e.type==='tank'?'#5a3a86':'#d92638',280,100);
  spawnFloatingText(Game,e.x,e.y-15,'+1','#d92638');
  if(Game.kills%10===0)Game.wave++;
}

function updateEnemies(Game,sdt){
  const p=Game.player,list=Game.boss?Game.enemies.concat([Game.boss]):Game.enemies;
  for(let i=0;i<list.length;i++){
    const e=list[i];if(e.dead)continue;e.flash=Math.max(0,e.flash-sdt*5);
    const ang=Math.atan2(p.y-e.y,p.x-e.x)+(e.jitter||0)*0.3;const c=Math.cos(ang),s=Math.sin(ang);
    if(e.isBoss){moveWithCollision(Game.map,e,c*e.speed*sdt,s*e.speed*sdt);e.burstCd-=sdt;if(e.burstCd<=0){e.burstCd=2.2;for(let k=0;k<12;k++){const a=(k/12)*Math.PI*2;Game.bullets.push({x:e.x,y:e.y,vx:Math.cos(a)*420,vy:Math.sin(a)*420,r:7,friendly:false,dmg:1,pierce:1,dead:false,color:'#d92638'});}}
    }else if(e.type==='shooter'){const los=raycastClear(Game.map,e.x,e.y,p.x,p.y);const near=Math.hypot(p.x-e.x,p.y-e.y)<80;if(!los||!near)moveWithCollision(Game.map,e,c*e.speed*sdt,s*e.speed*sdt);e.fireCd-=sdt;if(e.fireCd<=0&&los){e.fireCd=ENEMY_BASE.shooter.fireCd;Game.bullets.push({x:e.x,y:e.y,vx:c*ENEMY_BASE.shooter.bulletSpeed,vy:s*ENEMY_BASE.shooter.bulletSpeed,r:6,friendly:false,dmg:1,pierce:1,dead:false,color:'#d92638'});}
    }else{moveWithCollision(Game.map,e,c*e.speed*sdt,s*e.speed*sdt);}
    
    const rr=e.r+p.r;
    if(p.invuln<=0&&Math.hypot(e.x-p.x,e.y-p.y)<rr){
      p.hp--;
      p.invuln=1.2; // 1.2 сек бессмертия при ударе
      burst(Game,p.x,p.y,30,'#d92638',300);
      screenShake(Game,15);screenFlash(Game, 0.5);
      if(p.hp<=0) Game.die();
    }
  }
}

function updateBullets(Game,sdt){
  const bullets=Game.bullets,targets=Game.boss?Game.enemies.concat([Game.boss]):Game.enemies;const tgrid=buildGrid(targets);
  for(let i=0;i<bullets.length;i++){
    const b=bullets[i];b.x+=b.vx*sdt;b.y+=b.vy*sdt;
    if(b.trail){b.trail.push({x:b.x,y:b.y});if(b.trail.length>8)b.trail.shift();}
    if(isWallWorld(Game.map,b.x,b.y)){b.dead=true;if(b.splash){for(let j=0;j<targets.length;j++){const e=targets[j];if(e.dead)continue;if(Math.hypot(b.x-e.x,b.y-e.y)<b.splash){e.hp-=b.dmg;e.flash=1;if(e.hp<=0)killEnemy(Game,e);}}burst(Game,b.x,b.y,20,'#d97706',220,300);spawnImpact(Game,b.x,b.y,'#d97706',30);screenShake(Game,5);}else{burst(Game,b.x,b.y,5,'#888',80);spawnImpact(Game,b.x,b.y,'#1a1a1a',12);}continue;}
    if(b.x<0||b.y<0||b.x>Game.map.pxW||b.y>Game.map.pxH){b.dead=true;continue;}
    if(b.friendly){
      forNearby(tgrid,b.x,b.y,e=>{if(e.dead||b.dead)return;const rr=b.r+e.r;if(Math.hypot(b.x-e.x,b.y-e.y)<rr){e.hp-=b.dmg;e.flash=1;spawnFloatingText(Game,e.x,e.y-20,'-'+b.dmg,'#1a1a1a');spawnImpact(Game,b.x,b.y,b.color||'#1a1a1a',14);b.pierce--;if(b.pierce<=0)b.dead=true;if(e.hp<=0)killEnemy(Game,e);}});
      if(b.splash&&b.dead){for(let j=0;j<targets.length;j++){const e=targets[j];if(e.dead)continue;if(Math.hypot(b.x-e.x,b.y-e.y)<b.splash){e.hp-=b.dmg;e.flash=1;if(e.hp<=0)killEnemy(Game,e);}}burst(Game,b.x,b.y,24,'#d97706',250,300);spawnImpact(Game,b.x,b.y,'#d97706',35);screenShake(Game,6);}
    }else{
      const p=Game.player,rr=b.r+p.r*0.5;
      if(p.invuln<=0&&Math.hypot(b.x-p.x,b.y-p.y)<rr){
        b.dead=true;
        p.hp--;
        p.invuln=1.2;
        burst(Game,p.x,p.y,30,'#d92638',300);
        screenShake(Game,15);screenFlash(Game, 0.5);
        if(p.hp<=0) Game.die();
      }
    }
  }
}

const Game={
  state:'menu',viewW:window.innerWidth,viewH:window.innerHeight,effViewW:window.innerWidth,effViewH:window.innerHeight,
  map:null,camera:new Camera(),player:null,enemies:[],bullets:[],particles:[],banners:[],floatTexts:[],impacts:[],loot:[],
  level:0,levelCfg:null,wave:1,kills:0,timeScale:0.05,shotSlowmo:0,spawnT:0,globalPower:1,scaleT:5,
  boss:null,flash:0,shake:0,leaderboard:loadLeaderboard(),pendingScore:null,

  die(){
    if(this.state!=='play')return;
    this.state='death';
    burst(this,this.player.x,this.player.y,50,'#d92638',600,200);
    screenFlash(this,1.0);screenShake(this,12);
    const score=this.kills*15+(this.level+1)*300+this.wave*25;
    if(qualifies(this.leaderboard,score)){
      this.pendingScore={score,kills:this.kills,wave:this.wave,level:this.level+1};
      this.state='enter-name';
      document.getElementById('name-entry').style.display='flex';
      const el=document.getElementById('name-input');el.value='';
      setTimeout(()=>el.focus(),50);
    }
  },
  onBossDefeated(){this.level++;applyLevelStart(this);spawnBannerLevelUp(this,this.levelCfg);},
  start(){
    this.state='play';this.level=0;this.kills=0;
    this.enemies=[];this.bullets=[];this.particles=[];this.banners=[];this.floatTexts=[];this.impacts=[];this.loot=[];
    this.map=generateMap();this.player=createPlayer(this.map.spawnWorld);
    applyLevelStart(this);
    this.camera.x=clamp(this.player.x-this.viewW/2,0,Math.max(0,this.map.pxW-this.viewW));
    this.camera.y=clamp(this.player.y-this.viewH/2,0,Math.max(0,this.map.pxH-this.viewH));
    Input.cmd=false;
  },
  update(dt){
    if(this.state==='menu'){if(Input.cmd)this.start();Input.cmd=false;return;}
    if(this.state==='enter-name')return;
    if(this.state==='death'){
      if(Input.cmd)this.start();Input.cmd=false;
      for(let i=0;i<this.particles.length;i++){const pt=this.particles[i];pt.x+=pt.vx*dt;pt.y+=pt.vy*dt;pt.life-=dt;if(pt.gravity)pt.vy+=pt.gravity*dt;}
      compactByLife(this.particles);return;
    }
    const p=this.player,{mvX,mvY}=getMoveVector();
    if(Input.wantDash){const ddx=Input.dashDirX||mvX,ddy=Input.dashDirY||mvY;tryDash(this,ddx,ddy);Input.wantDash=false;Input.dashDirX=0;Input.dashDirY=0;}
    const moving=updatePlayerMove(this,dt,mvX,mvY);
    this.timeScale=moving?1.0:(this.shotSlowmo>0?0.3:0.03);
    this.shotSlowmo=Math.max(0,this.shotSlowmo-dt);
    const sdt=dt*this.timeScale;
    this.camera.follow(p,this.viewW,this.viewH,dt);
    p.cd=Math.max(0,p.cd-dt);
    if(p.reloading>0){p.reloading-=dt;if(p.reloading<=0)p.ammo=WEAPONS[p.weaponId].ammoMax;}
    if(Input.wantReload){reloadWeapon(this);Input.wantReload=false;}
    const mw={x:Input.mouse.x+this.camera.x,y:Input.mouse.y+this.camera.y};
    if(Input.fireReq){fireWeapon(this,mw.x,mw.y);if(!WEAPONS[p.weaponId].auto)Input.fireReq=false;}
    this.scaleT-=dt;
    if(this.scaleT<=0){this.scaleT=5;this.globalPower=Math.min(4.5,this.globalPower*1.11);}
    maybeUnlockWeapon(this);maybeUnlockDash(this);
    if(!this.boss&&this.wave>=this.levelCfg.bossWave){spawnBoss(this);}
    else if(!this.boss){
      this.spawnT-=sdt;
      const cap=Math.min(140,18+Math.min(this.wave,20)*5+Math.floor(this.globalPower*6));
      if(this.spawnT<=0&&this.enemies.length<cap){this.spawnT=Math.max(0.18,1.1-Math.min(this.wave,20)*0.055-(this.globalPower-1)*0.12);spawnEnemy(this);}
    }
    updateEnemies(this,sdt);updateBullets(this,sdt);
    
    // Подбор предметов
    if(this.loot) {
      let keptLoot = [];
      for(let i=0; i<this.loot.length; i++){
        let l = this.loot[i];
        if(Math.hypot(p.x - l.x, p.y - l.y) < p.r + l.r + 15) { 
          if(l.type === 'hp') {
            if(p.hp < p.maxHp) {
              p.hp++;
              spawnFloatingText(this, p.x, p.y-20, '+1 HP', '#10b981');
              burst(this, p.x, p.y, 15, '#10b981', 180);
            } else {
              this.kills += 15;
              spawnFloatingText(this, p.x, p.y-20, '+15 ОЧКОВ', '#e8a317');
            }
          } else if(l.type === 'weapon') {
            this.globalPower += 0.15;
            this.kills += 25;
            spawnFloatingText(this, p.x, p.y-20, 'МОЩЬ UP!', l.color);
            burst(this, p.x, p.y, 30, l.color, 250);
            screenFlash(this, 0.3);
          }
        } else {
          keptLoot.push(l);
        }
      }
      this.loot = keptLoot;
    }

    for(let i=0;i<this.particles.length;i++){const pt=this.particles[i];pt.x+=pt.vx*dt;pt.y+=pt.vy*dt;pt.life-=dt;if(pt.gravity)pt.vy+=pt.gravity*dt;}
    compact(this.enemies,'dead');compact(this.bullets,'dead');compactByLife(this.particles);
    if(this.boss&&this.boss.dead)this.boss=null;
    this.shake=Math.max(0,this.shake-dt*15);
  },
  draw(){
    ctx.clearRect(0,0,this.viewW,this.viewH);
    if(this.state==='menu'){drawMenu();return;}
    ctx.save();
    const sx=(Math.random()-0.5)*this.shake*2,sy=(Math.random()-0.5)*this.shake*2;
    ctx.translate(sx-Math.round(this.camera.x),sy-Math.round(this.camera.y));
    drawMap(this.camera,this.viewW,this.viewH);
    drawWorldEntities();
    ctx.restore();
    drawHud();drawMinimap();
    this.flash=Math.max(0,(this.flash||0)-0.033*3);
    if(this.flash>0.01){
      ctx.fillStyle='rgba(255,255,255,'+(this.flash*0.6)+')';
      ctx.fillRect(0,0,this.viewW,this.viewH);
      if(this.flash>0.3){ctx.fillStyle='rgba(255,0,0,'+(this.flash*0.08)+')';ctx.fillRect(0,0,this.viewW*0.03,this.viewH);ctx.fillRect(this.viewW*0.97,0,this.viewW*0.03,this.viewH);}
    }
    updateAndDrawBanners(ctx,this,1/60,this.viewW,this.viewH);
    updateAndDrawFloatTexts(ctx,this,1/60);
    updateAndDrawImpacts(ctx,this,1/60);
    if(this.state==='death')drawDeathScreen();
  },
  loop(t){
    const now=t/1000;
    const dt=Math.min(now-(this.last||now),0.1);
    this.last=now;
    this.update(dt);
    this.draw();
    requestAnimationFrame(n=>this.loop(n));
  },
  init(){
    resize();
    window.addEventListener('resize',resize);
    window.addEventListener('orientationchange',()=>setTimeout(resize,150));
    initInput(canvas);
    wireNameEntry();
    requestAnimationFrame(t=>this.loop(t));
  }
};

function spawnBannerLevelUp(Game,cfg){
  Game.banners.push({title:'НОВЫЙ УРОВЕНЬ',subtitle:cfg.name+' ОТКРЫТ',color:'#d97706',t:0,duration:2.2});
  screenFlash(Game,1.0);screenShake(Game,8);
  burst(Game,Game.player.x,Game.player.y,60,'#d97706',400);
}

function drawMap(cam,vw,vh){
  ctx.fillStyle='#e8e2d6';
  ctx.fillRect(cam.x-4,cam.y-4,vw+8,vh+8);
  const map=Game.map;
  const tx0=Math.max(0,Math.floor(cam.x/TILE)-1);
  const ty0=Math.max(0,Math.floor(cam.y/TILE)-1);
  const tx1=Math.min(MAP_W,Math.ceil((cam.x+vw)/TILE)+1);
  const ty1=Math.min(MAP_H,Math.ceil((cam.y+vh)/TILE)+1);
  for(let ty=ty0;ty<ty1;ty++){
    for(let tx=tx0;tx<tx1;tx++){
      const wall=map.grid[map.idx(tx,ty)]===1;
      const x=tx*TILE,y=ty*TILE;
      if(wall){
        ctx.fillStyle=(tx+ty)%2===0?'#c4b8a8':'#b8aa98';
        ctx.fillRect(x,y,TILE,TILE);
        ctx.strokeStyle='rgba(100,80,60,0.25)';ctx.strokeRect(x+1,y+1,TILE-2,TILE-2);
      }else{
        ctx.fillStyle=(tx+ty)%2===0?'#f0ebe0':'#ebe5d8';
        ctx.fillRect(x,y,TILE,TILE);
      }
    }
  }
}

function drawWorldEntities(){
  // 1. Отрисовка выпавшего лута
  if(Game.loot) {
    for(let i=0; i<Game.loot.length; i++){
      let l = Game.loot[i];
      ctx.shadowBlur = 12;
      if(l.type === 'hp'){
        ctx.shadowColor = '#d92638';
        ctx.fillStyle = '#d92638';
        ctx.beginPath(); ctx.arc(l.x, l.y, l.r, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.fillRect(l.x-2, l.y-l.r+2, 4, l.r*2-4); 
        ctx.fillRect(l.x-l.r+2, l.y-2, l.r*2-4, 4);
      } else if(l.type === 'weapon') {
        ctx.shadowColor = l.color;
        ctx.fillStyle = l.color;
        ctx.beginPath(); ctx.moveTo(l.x, l.y-l.r); ctx.lineTo(l.x+l.r, l.y); ctx.lineTo(l.x, l.y+l.r); ctx.lineTo(l.x-l.r, l.y); ctx.fill();
      }
      ctx.shadowBlur = 0;
    }
  }

  // 2. Отрисовка частиц
  for(let i=0;i<Game.particles.length;i++){
    const pt=Game.particles[i];
    const a=Math.max(0,Math.min(1,pt.life*2.5));
    ctx.globalAlpha=a;
    if(pt.glow){ctx.shadowColor=pt.color;ctx.shadowBlur=12;}
    ctx.fillStyle=pt.color;
    ctx.beginPath();ctx.arc(pt.x,pt.y,pt.size||4,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
  }
  ctx.globalAlpha=1;

  // 3. Отрисовка пуль
  for(let i=0;i<Game.bullets.length;i++){
    const b=Game.bullets[i];
    if(b.trail&&b.trail.length>1){
      for(let j=1;j<b.trail.length;j++){
        const t1=b.trail[j-1],t2=b.trail[j];
        ctx.strokeStyle=b.color||'#e8a317';ctx.lineWidth=b.r*(j/b.trail.length)*1.2;
        ctx.globalAlpha=0.6*(j/b.trail.length);
        ctx.beginPath();ctx.moveTo(t1.x,t1.y);ctx.lineTo(t2.x,t2.y);ctx.stroke();
      }
    }
    ctx.globalAlpha=1;
    ctx.shadowBlur=14;ctx.shadowColor=b.color||'#e8a317';
    ctx.fillStyle=b.color||'#e8a317';
    ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
  }

  // 4. Отрисовка врагов
  const elist=Game.boss?Game.enemies.concat([Game.boss]):Game.enemies;
  for(let i=0;i<elist.length;i++){
    const e=elist[i];
    const bc=e.isBoss?'#d92638':e.type==='shooter'?'#b829dd':e.type==='tank'?'#5a3a86':'#d92638';
    if(e.flash>0){
      ctx.shadowColor='#fff';ctx.shadowBlur=20;
      ctx.fillStyle='rgba(255,255,255,'+(e.flash*0.8)+')';
      ctx.beginPath();ctx.arc(e.x,e.y,e.r*1.3,0,Math.PI*2);ctx.fill();
    }else{
      const ag=ctx.createRadialGradient(e.x,e.y,0,e.x,e.y,e.r*2);
      ag.addColorStop(0,bc+'44');ag.addColorStop(1,bc+'00');
      ctx.fillStyle=ag;ctx.beginPath();ctx.arc(e.x,e.y,e.r*2,0,Math.PI*2);ctx.fill();
    }
    ctx.shadowBlur=0;
    ctx.fillStyle=e.flash>0?'#fff':bc;
    ctx.strokeStyle=e.flash>0?'#fff':'#1a1a1a';ctx.lineWidth=e.isBoss?4:2;
    ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.fill();ctx.stroke();
    if(e.type==='shooter'){ctx.fillStyle='#fff';ctx.fillRect(e.x-3,e.y-8,6,6);}
    if(e.maxHp>1){
      const w=Math.min(e.r*2.5,80);
      ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(e.x-w/2,e.y-e.r-14,w,6);
      ctx.fillStyle=e.isBoss?'#d92638':'#e8a317';
      ctx.fillRect(e.x-w/2,e.y-e.r-14,w*(e.hp/e.maxHp),6);
    }
  }

  // 5. Отрисовка игрока и полоски HP
  const p=Game.player;
  const pg=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,100);
  pg.addColorStop(0,'rgba(232,163,23,0.18)');pg.addColorStop(1,'rgba(232,163,23,0)');
  ctx.fillStyle=pg;ctx.beginPath();ctx.arc(p.x,p.y,100,0,Math.PI*2);ctx.fill();
  if(p.dashT>0){ctx.shadowColor='#0ea5c7';ctx.shadowBlur=20;}
  else if(p.invuln>0){ctx.shadowColor='#0ea5c7';ctx.shadowBlur=12;}
  else{ctx.shadowColor='#e8a317';ctx.shadowBlur=8;}
  ctx.fillStyle=p.dashT>0?'#0ea5c7':p.invuln>0?'#0ea5c7':'#1a1a1a';
  ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;

  // Зеленая полоска HP над головой
  if(p && p.hp > 0){
    const w = 36;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(p.x - w/2, p.y - p.r - 14, w, 6);
    ctx.fillStyle = '#10b981';
    ctx.fillRect(p.x - w/2, p.y - p.r - 14, w * (p.hp/p.maxHp), 6);
  }

  if(!isMobile){
    const mw={x:Input.mouse.x+Game.camera.x,y:Input.mouse.y+Game.camera.y};
    ctx.strokeStyle='rgba(232,163,23,0.3)';ctx.lineWidth=1.5;
    ctx.setLineDash([5,5]);
    ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(mw.x,mw.y);ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle='rgba(232,163,23,0.5)';
    ctx.beginPath();ctx.arc(mw.x,mw.y,4,0,Math.PI*2);ctx.fill();
  }
}

function drawHud(){
  const p=Game.player;
  const fs=Math.max(11,Math.min(15,Game.viewW/32));
  ctx.shadowColor='rgba(255,255,255,0.5)';ctx.shadowBlur=4;
  ctx.fillStyle='#1a1a1a';ctx.font='bold '+fs+'px monospace';ctx.textAlign='left';
  ctx.fillText('УР:'+(Game.level+1)+' В:'+Game.wave+(Game.boss?' [БОСС]':'')+' КИЛЛ:'+Game.kills,12,28);

  const w=WEAPONS[p.weaponId];
  let as=p.reloading>0?'РЕЛОАД...':'['+'●'.repeat(p.ammo)+'○'.repeat(Math.max(0,w.ammoMax-p.ammo))+']';
  ctx.textAlign='right';ctx.fillStyle=p.reloading>0?'#888':'#1a1a1a';
  const minimapSize=Math.min(140,Game.viewW*0.2);
  ctx.fillText(w.icon+' '+as,Game.viewW-minimapSize-18,28);

  ctx.fillStyle=Game.timeScale<=0.1?'#888':'#e8a317';
  ctx.fillText(Game.timeScale<=0.1?'◆ СТОП':'▶ ХОД',Game.viewW-22,Game.viewH-48);
  if(p.dashUnlocked){
    ctx.fillStyle=p.dashCd>0?'#999':'#0ea5c7';
    ctx.fillText(p.dashCd>0?'РЫВОК '+p.dashCd.toFixed(1)+'с':'РЫВОК ГОТОВ',Game.viewW-22,Game.viewH-24);
  }
  ctx.shadowBlur=0;
  if(Game.boss){
    const bw=Math.min(520,Game.viewW-60);
    ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(Game.viewW/2-bw/2,48,bw,14);
    const grad=ctx.createLinearGradient(Game.viewW/2-bw/2,0,Game.viewW/2+bw/2,0);
    grad.addColorStop(0,'#d92638');grad.addColorStop(1,'#ff6b7d');
    ctx.fillStyle=grad;ctx.fillRect(Game.viewW/2-bw/2,48,bw*(Game.boss.hp/Game.boss.maxHp),14);
    ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=1;ctx.strokeRect(Game.viewW/2-bw/2,48,bw,14);
    ctx.fillStyle='#1a1a1a';ctx.font='bold 12px monospace';ctx.textAlign='center';
    ctx.fillText('БОСС',Game.viewW/2,59);
  }
}

function drawMinimap(){
  const sz=Math.min(140,Game.viewW*0.2),pd=Math.min(14,Game.viewW*0.028);
  const ox=Game.viewW-sz-pd,oy=pd;
  ctx.fillStyle='rgba(240,235,224,0.85)';ctx.fillRect(ox,oy,sz,sz);
  ctx.strokeStyle='rgba(200,160,80,0.3)';ctx.lineWidth=1;ctx.strokeRect(ox,oy,sz,sz);
  const sx=sz/MAP_W,sy=sz/MAP_H;
  const map=Game.map;
  ctx.fillStyle='#c4b8a8';
  for(let ty=0;ty<MAP_H;ty+=2)for(let tx=0;tx<MAP_W;tx+=2)if(map.grid[map.idx(tx,ty)]===1)ctx.fillRect(ox+tx*sx,oy+ty*sy,sx*2,sy*2);
  const p=Game.player;
  ctx.fillStyle='#e8a317';ctx.shadowColor='#e8a317';ctx.shadowBlur=6;
  ctx.beginPath();ctx.arc(ox+(p.x/TILE)*sx,oy+(p.y/TILE)*sy,3,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;ctx.fillStyle='#d92638';
  const elist=Game.boss?Game.enemies.concat([Game.boss]):Game.enemies;
  for(let i=0;i<elist.length;i++){const e=elist[i];ctx.beginPath();ctx.arc(ox+(e.x/TILE)*sx,oy+(e.y/TILE)*sy,e.isBoss?4:2,0,Math.PI*2);ctx.fill();}
}

function drawMenu(){
  const g=ctx.createLinearGradient(0,0,0,Game.viewH);
  g.addColorStop(0,'#faf6f0');g.addColorStop(1,'#f5f0e8');
  ctx.fillStyle=g;ctx.fillRect(0,0,Game.viewW,Game.viewH);
  const ts=Math.min(85,Game.viewW/9);
  ctx.shadowColor='#d92638';ctx.shadowBlur=20;
  ctx.fillStyle='#d92638';ctx.font='bold '+ts+'px monospace';ctx.textAlign='center';
  ctx.fillText('М Я С О Р У Б К А',Game.viewW/2,Game.viewH*0.3);
  ctx.shadowBlur=0;
  const ss=Math.max(13,Math.min(18,Game.viewW/38));
  ctx.fillStyle='#5a5a5a';ctx.font=ss+'px monospace';
  ctx.fillText('Двигайся — время идёт. Стой — время замирает.',Game.viewW/2,Game.viewH*0.3+ts*0.55);
  ctx.fillStyle='#e8a317';ctx.shadowColor='#e8a317';ctx.shadowBlur=8;
  ctx.fillText('КЛИК / ТАП / ENTER чтобы начать',Game.viewW/2,Game.viewH*0.3+ts*0.95);
  ctx.shadowBlur=0;
  const list=Game.leaderboard;
  if(list.length){
    const sy=Game.viewH*0.3+ts*1.35;
    ctx.fillStyle='#1a1a1a';ctx.font='bold '+ss+'px monospace';
    ctx.fillText('ТАБЛИЦА ЛИДЕРОВ',Game.viewW/2,sy);
    ctx.font=(ss-2)+'px monospace';
    for(let i=0;i<Math.min(5,list.length);i++){
      const e=list[i];ctx.fillStyle=i===0?'#e8a317':'#7a7a7a';
      ctx.fillText((i+1)+'. '+e.name+' — '+e.score+' очк. (ур.'+e.level+', волна '+e.wave+')',Game.viewW/2,sy+28+i*(ss+4));
    }
  }
}

function drawDeathScreen(){
  ctx.fillStyle='rgba(245,240,232,0.85)';ctx.fillRect(0,0,Game.viewW,Game.viewH);
  const ts=Math.min(75,Game.viewW/10);
  ctx.shadowColor='#d92638';ctx.shadowBlur=20;
  ctx.fillStyle='#d92638';ctx.font='bold '+ts+'px monospace';ctx.textAlign='center';
  ctx.fillText('П О Т Р А Ч Е Н О',Game.viewW/2,Game.viewH*0.32);
  ctx.shadowBlur=0;
  const ss=Math.max(13,Math.min(20,Game.viewW/36));
  ctx.fillStyle='#5a5a5a';ctx.font=ss+'px monospace';
  ctx.fillText('Убито: '+Game.kills+' · Волна: '+Game.wave+' · Уровень: '+(Game.level+1),Game.viewW/2,Game.viewH*0.32+ts*0.6);
  ctx.fillStyle='#e8a317';ctx.shadowColor='#e8a317';ctx.shadowBlur=6;
  ctx.fillText('КЛИК / ТАП / ENTER заново',Game.viewW/2,Game.viewH*0.32+ts*0.95);
  ctx.shadowBlur=0;
  const list=Game.leaderboard;
  if(list.length){
    const sy=Game.viewH*0.32+ts*1.25;
    ctx.fillStyle='#1a1a1a';ctx.font='bold '+(ss-1)+'px monospace';
    ctx.fillText('ТАБЛИЦА ЛИДЕРОВ',Game.viewW/2,sy);
    ctx.font=(ss-2)+'px monospace';
    for(let i=0;i<Math.min(5,list.length);i++){
      const e=list[i];ctx.fillStyle=i===0?'#e8a317':'#7a7a7a';
      ctx.fillText((i+1)+'. '+e.name+' — '+e.score+' очк.',Game.viewW/2,sy+26+i*(ss+2));
    }
  }
}

function wireNameEntry(){
  const form=document.getElementById('name-form');
  const inputEl=document.getElementById('name-input');
  form.addEventListener('submit',e=>{
    e.preventDefault();
    const name=(inputEl.value||'ИГРОК').trim().slice(0,12)||'ИГРОК';
    Game.leaderboard=addEntry(Game.leaderboard,{name,...Game.pendingScore,date:Date.now()});
    Game.pendingScore=null;
    document.getElementById('name-entry').style.display='none';
    Game.state='death';
  });
}

window.onload=()=>Game.init();
</script>
